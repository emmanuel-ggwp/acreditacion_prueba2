# infra/ssh/99-hardening.conf — SSH solo con clave (plan 07, fase 3).
# Se instala en /etc/ssh/sshd_config.d/ (en sshd gana el PRIMER valor leído y
# los drop-ins se leen antes que el cuerpo de sshd_config, así que esto manda).
#
# provision.sh SOLO lo instala si existe al menos un authorized_keys con
# contenido: sin esa guarda, aplicarlo sería cerrarse la puerta del droplet.

# Sin contraseñas: ni las adivinables ni las fuertes — solo clave pública.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# Sin root: la administración entra con el usuario administrador (lo crea
# provision.sh con la clave de root copiada) y usa sudo.
PermitRootLogin no

X11Forwarding no
