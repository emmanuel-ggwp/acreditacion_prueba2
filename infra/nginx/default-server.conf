# infra/nginx/default-server.conf — rechazo de hosts desconocidos (plan 07).
#
# El síntoma del ataque fue una redirección de dominio y nunca se supo de qué
# capa salió. Sin un default_server explícito, CUALQUIER dominio apuntado a la
# IP del droplet recibe la aplicación. Con esto, toda petición cuyo Host/SNI no
# sea el server_name del sitio real se corta sin respuesta.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # 444: nginx cierra la conexión sin enviar respuesta.
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # Corta el handshake TLS de los SNI desconocidos sin necesidad de tener un
    # certificado comodín para el default_server (nginx >= 1.19.4).
    ssl_reject_handshake on;
}
